# Serves the production build (dist/public) with SPA fallback.
# Meta pages at /content/<slug>/index.html win before the fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match Vercel's compression so local Lighthouse numbers are comparable.
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location / {
        # Serve /content/<slug> directly from its index.html — no trailing-slash
        # redirect, so the SPA router sees the canonical slug URL.
        try_files $uri $uri/index.html /index.html;
    }

    # Hashed bundles never change — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
