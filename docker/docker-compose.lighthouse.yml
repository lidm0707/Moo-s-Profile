# Local Lighthouse audit of the production build — same engine as PageSpeed
# Insights, run against ./dist/public before deploying.
#   make build
#   make lighthouse   # prints category scores, full report in lighthouse/report.json
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../dist/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  lighthouse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.lighthouse
    depends_on:
      - web
    volumes:
      - ../lighthouse:/report
    # A beat so nginx is answering before Chrome connects; then the image CMD
    # runs Lighthouse and prints the category scores.
    command: sh -c "sleep 2 && npx -y lighthouse http://web:80 --quiet --output=json --output=html --output-path=/report/lighthouse --chrome-flags=\"--headless --no-sandbox\" && node -e \"const fs=require('fs');const {categories}=JSON.parse(fs.readFileSync('/report/lighthouse.report.json','utf8'));for(const[k,c]of Object.entries(categories))console.log(k.padEnd(18),Math.round(c.score*100))\""
