        <!-- Google Fonts: loaded non-blocking (print-media swap) to avoid render-blocking CSS -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" media="print" onload="this.media='all'">

        </noscript>
        <!-- Google CMP (Funding Choices) — must load BEFORE adsbygoogle so consent is established first. Replace pub-XXXX with your own publisher id for other sites. -->
        <script async src="https://fundingchoicesmessages.google.com/i/pub-3526470154848781?ers=1"></script>
        <script>(function() {
            function signalGooglefcPresent() {
                if (!window.frames['googlefcPresent']) {
                    if (document.body) {
                        const iframe = document.createElement('iframe');
                        iframe.style = 'width: 0; height: 0; border: none; z-index: -1000; left: -1000px; top: -1000px;';
                        iframe.style.display = 'none';
                        iframe.name = 'googlefcPresent';
                        document.body.appendChild(iframe);
                    } else {
                        setTimeout(signalGooglefcPresent, 0);
                    }
                }
            }
            signalGooglefcPresent();
        })();</script>
        <!-- Google AdSense library — injected AFTER first load + idle so the ad
             never becomes the LCP element and its long tasks don't hurt TBT/TTI.
             Keep the `adsbygoogle.js?client=` marker intact: build.rs parses the
             publisher id from it. -->
        <script>
        (function () {
            var CLIENT_ID = 'ca-pub-3526470154848781';
            var SRC = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3526470154848781';
            var INJECT_DELAY_MS = 2000;
            var injected = false;
            function inject() {
                if (injected) return;
                injected = true;
                var s = document.createElement('script');
                s.async = true;
                s.src = SRC;
                s.crossOrigin = 'anonymous';
                document.head.appendChild(s);
            }
            function onReady() {
                if ('requestIdleCallback' in window) {
                    requestIdleCallback(inject, { timeout: INJECT_DELAY_MS });
                } else {
                    setTimeout(inject, INJECT_DELAY_MS);
                }
            }
            if (document.readyState === 'complete') { onReady(); }
            else { window.addEventListener('load', onReady, { once: true }); }
        })();
        </script>
    </head>
    <body>
        <!-- Static splash overlay: paints instantly while the wasm downloads/boots.
             Dioxus APPENDS into #main (it does not clear it), so the splash lives
             outside #main and removes itself once the app renders its first node. -->
        <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#14101c;color:#f5f2fa;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">
            <div>
                <p style="font-size:12px;letter-spacing:2px;color:#9b8fb8;margin:0 0 16px">プロフィール · PROFILE</p>
                <h1 style="font-size:48px;line-height:1.15;margin:0 0 16px">Hi there — I'm Moo!</h1>
                <p style="font-size:16px;line-height:1.6;color:#b9aecf;margin:0;max-width:420px">I'm passionate about creating, learning, and innovating in the field of technology.</p>
                <p style="font-size:14px;color:#8a7fa8;margin:16px 0 0">Loading…</p>
            </div>
        </div>
        <!-- Content data ships as a separate JSON file (fetched at boot by the
             app); preloading downloads it in parallel with the wasm. -->
        <link rel="preload" href="/content_snapshot.json" as="fetch" crossorigin>
        <div id="main"></div>
        <script>
        (function () {
            var main = document.getElementById('main');
            var splash = document.getElementById('splash');
            if (!main || !splash || !window.MutationObserver) { if (splash) splash.remove(); return; }
            function drop() {
                if (splash) { splash.remove(); splash = null; }
                mo.disconnect();
            }
            var mo = new MutationObserver(function () {
                if (main.querySelector('[data-node-hydration], h1, a, header, section')) { drop(); }
            });
            mo.observe(main, { childList: true, subtree: true });
            // Safety net: never keep the splash up for more than 8s.
            setTimeout(drop, 8000);
        })();
        </script>
        <div class="ad-rail">
            <!-- .ad-frame absorbs AdSense's parent style injection
                 (height:auto !important) so .ad-rail stays size-locked (CLS). -->
            <button type="button" class="ad-rail-close" aria-label="Close ad" onclick="this.parentElement.style.display='none'">×</button>
            <div class="ad-frame"><ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-3526470154848781"
                 data-ad-slot="7363546319"
                 data-ad-format="auto"
                 data-full-width-responsive="false"></ins></div>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </body>
